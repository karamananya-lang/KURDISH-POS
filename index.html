</tr>
</thead>

<div class="actions">

<button onclick="checkout()" id="payBtn">پارەدان</button>
<button onclick="clearCart()" id="clearBtn">سڕینەوە</button>
</div>

<div class="note" id="note">هیچ کاڵایەک زیاد نەکراوە. خۆت بارکۆدەکان داخل بکە.</div>

</div>

<script>
let products = JSON.parse(localStorage.getItem("products")) || [];
let cart = [];

if(products.length===0){
products = [
{code:"1001",name_ku:"پەپسی",name_en:"Pepsi",name_ar:"بيبسي",price:500},
{code:"1002",name_ku:"نان",name_en:"Bread",name_ar:"خبز",price:250},
{code:"1003",name_ku:"چیپس",name_en:"Chips",name_ar:"شيبس",price:750}
];
localStorage.setItem("products",JSON.stringify(products));
}

let lang="ku";

function productName(p){
if(lang==="en") return p.name_en;
if(lang==="ar") return p.name_ar;
return p.name_ku;
}

function setLang(){
lang=document.getElementById("lang").value;

const txt={
ku:{
title:"سیستەمی فرۆشتن", c1:"کاڵا", c2:"ژمارە", c3:"نرخ",
total:"کۆی گشتی", receipt:"پسووڵە", pay:"پارەدان", clear:"سڕینەوە",
placeholder:"بارکۆد بنووسە و Enter بکە",
note:"هیچ کاڵایەک زیاد نەکراوە. خۆت بارکۆدەکان داخل بکە."
},
en:{
title:"POS System", c1:"Item", c2:"Qty", c3:"Price",
total:"Total", receipt:"Receipt", pay:"Pay", clear:"Clear",
placeholder:"Type barcode and press Enter",
note:"No items included. Add your own barcodes."
},
ar:{
title:"نظام البيع", c1:"المنتج", c2:"الكمية", c3:"السعر",
total:"المجموع", receipt:"الإيصال", pay:"دفع", clear:"مسح",
placeholder:"اكتب الباركود واضغط Enter",
note:"لا توجد منتجات مضافة. أضف الباركود بنفسك."
}
}[lang];

document.getElementById("title").innerText=txt.title;
document.getElementById("c1").innerText=txt.c1;
document.getElementById("c2").innerText=txt.c2;
document.getElementById("c3").innerText=txt.c3;
document.getElementById("tlabel").innerText=txt.total;
document.getElementById("receiptBtn").innerText=txt.receipt;
document.getElementById("payBtn").innerText=txt.pay;
document.getElementById("clearBtn").innerText=txt.clear;
document.getElementById("barcode").placeholder=txt.placeholder;
document.getElementById("note").innerText=txt.note;

renderCart();
}

document.getElementById("barcode").addEventListener("keydown",function(e){
if(e.key==="Enter"){
addByBarcode(this.value.trim());
this.value="";
}
});

function addByBarcode(code){
let p=products.find(x=>x.code===code);
if(!p){
alert("Barcode not found");
return;
}
let found=cart.find(x=>x.code===code);
if(found){
found.qty++;
}else{
cart.push({...p,qty:1});
}
renderCart();
}

function renderCart(){
let box=document.getElementById("cart");
box.innerHTML="";
let total=0;

cart.forEach(item=>{
let sum=item.price*item.qty;
total+=sum;
box.innerHTML += `
<tr>
<td>${productName(item)}</td>
<td>${item.qty}</td>
<td>${sum}</td>
</tr>
`;
});

document.getElementById("total").innerText=total;
}

function printReceipt(){
let text="";
cart.forEach(i=>{
text += productName(i)+" x"+i.qty+" - "+(i.qty*i.price)+" IQD\n";
});

let win=window.open("","","width=350,height=600");
win.document.write("<pre style='font-size:18px'>" +
"Receipt\n------------------\n"+
text+
"------------------\n"+
"Total: "+document.getElementById("total").innerText+" IQD\n"+
new Date().toLocaleString()+
"</pre>");
win.print();
}

function checkout(){
alert("Done");
cart=[];
renderCart();
}

function clearCart(){
cart=[];
renderCart();
}

setLang();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>POS System</title>
<style>
body{font-family:Arial;background:#f4f4f4;padding:20px}
.box{max-width:800px;margin:auto;background:#fff;padding:20px;border-radius:10px}
input,button{padding:10px;margin:5px;width:100%;box-sizing:border-box}
button{background:#0b8a3b;color:#fff;border:none;cursor:pointer}
button:hover{opacity:0.9}
.hidden{display:none}
.item{padding:10px;border:1px solid #ddd;margin:5px;border-radius:5px}
</style>
</head>
<body>

<div class="box">

<!-- REGISTER -->
<div id="registerBox">
<h2>Create Account</h2>
<input id="rUser" placeholder="Username">
<input id="rPass" type="password" placeholder="Password">
<button onclick="register()">Create Account</button>
</div>

<!-- LOGIN -->
<div id="loginBox">
<h2>Login</h2>
<input id="lUser" placeholder="Username">
<input id="lPass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="app" class="hidden">

<h2>POS SYSTEM</h2>
<button onclick="logout()">Logout</button>

<h3>Add Product</h3>
<input id="pName" placeholder="Name">
<input id="pCode" placeholder="Barcode">
<input id="pPrice" type="number" placeholder="Price">
<button onclick="addProduct()">Add</button>

<h3>Products</h3>
<div id="list"></div>

</div>

</div>

<script>

// USERS
let users = JSON.parse(localStorage.getItem("users")) || [];
let currentUser = localStorage.getItem("logged");

// PRODUCTS
let products = JSON.parse(localStorage.getItem("products")) || [];

function register(){
let u = document.getElementById("rUser").value;
let p = document.getElementById("rPass").value;

if(!u || !p) return alert("Fill all");

users.push({user:u,pass:p});
localStorage.setItem("users",JSON.stringify(users));

alert("Account created");
}

function login(){
let u = document.getElementById("lUser").value;
let p = document.getElementById("lPass").value;

let found = users.find(x=>x.user===u && x.pass===p);

if(found){
localStorage.setItem("logged",u);
showApp();
}else{
alert("Wrong login");
}
}

function logout(){
localStorage.removeItem("logged");
location.reload();
}

function showApp(){
document.getElementById("registerBox").style.display="none";
document.getElementById("loginBox").style.display="none";
document.getElementById("app").classList.remove("hidden");
render();
}

function addProduct(){
let name=document.getElementById("pName").value;
let code=document.getElementById("pCode").value;
let price=document.getElementById("pPrice").value;

if(!name||!code||!price) return;

products.push({name,code,price:Number(price)});
localStorage.setItem("products",JSON.stringify(products));

render();
}

function deleteProduct(i){
products.splice(i,1);
localStorage.setItem("products",JSON.stringify(products));
render();
}

function render(){
let box=document.getElementById("list");
box.innerHTML="";

products.forEach((p,i)=>{
box.innerHTML+=`
<div class="item">
<b>${p.name}</b><br>
${p.price} IQD<br>
<button onclick="deleteProduct(${i})">Delete</button>
</div>
`;
});
}

// AUTO LOGIN CHECK
if(currentUser){
showApp();
}

</script>

</body>
</html>

<script>
/* ---------- DATA ---------- */
let discount = 0;
let couponDiscount = 0;
let coupons = JSON.parse(localStorage.getItem("coupons")) || {};

/* ---------- LANGUAGE ---------- */
function setLang(l){
lang = l;

const txt = {
ku:{
discount:"داشکاندن",
coupon:"دروستکردنی کۆپۆن",
apply:"جێبەجێکردن",
discountPlace:"بڕی داشکاندن",
couponPlace:"کۆدی کۆپۆن",
askCode:"کۆدی کۆپۆن بنووسە",
askPrice:"بڕی داشکاندنی کۆپۆن",
made:"کۆپۆن دروستکرا",
bad:"کۆپۆن نەدۆزرایەوە",
discLine:"داشکاندن",
couponLine:"کۆپۆن"
},
en:{
discount:"Discount",
coupon:"Create Coupon",
apply:"Apply",
discountPlace:"Discount Amount",
couponPlace:"Coupon Code",
askCode:"Enter coupon code",
askPrice:"Enter coupon value",
made:"Coupon created",
bad:"Coupon not found",
discLine:"Discount",
couponLine:"Coupon"
},
ar:{
discount:"خصم",
coupon:"إنشاء كوبون",
apply:"تطبيق",
discountPlace:"قيمة الخصم",
couponPlace:"رمز الكوبون",
askCode:"اكتب رمز الكوبون",
askPrice:"اكتب قيمة الكوبون",
made:"تم إنشاء الكوبون",
bad:"الكوبون غير موجود",
discLine:"الخصم",
couponLine:"الكوبون"
}
}[lang];

document.getElementById("discountBtn").innerText = txt.discount;
document.getElementById("couponBtn").innerText = txt.coupon;
document.getElementById("applyBtn").innerText = txt.apply;
document.getElementById("discountAmount").placeholder = txt.discountPlace;
document.getElementById("couponCode").placeholder = txt.couponPlace;
}

/* ---------- OPEN PANEL ---------- */
function toggleDiscountBox(){
let box = document.getElementById("discountBox");
box.style.display = box.style.display === "none" ? "block" : "none";
}

/* ---------- CREATE COUPON ---------- */
function createCoupon(){
let code = prompt(
lang==="ku" ? "کۆدی کۆپۆن بنووسە" :
lang==="ar" ? "اكتب رمز الكوبون" :
"Enter coupon code"
);

if(!code) return;

let value = prompt(
lang==="ku" ? "بڕی داشکاندن بنووسە" :
lang==="ar" ? "اكتب قيمة الكوبون" :
"Enter coupon value"
);

if(!value) return;

coupons[code] = Number(value);
localStorage.setItem("coupons", JSON.stringify(coupons));

alert(
lang==="ku" ? "کۆپۆن دروستکرا ✔" :
lang==="ar" ? "تم إنشاء الكوبون ✔" :
"Coupon created ✔"
);
}

/* ---------- APPLY DISCOUNT ---------- */
function applyDiscount(){
discount = Number(document.getElementById("discountAmount").value) || 0;

let code = document.getElementById("couponCode").value.trim();

couponDiscount = 0;

if(code){
if(coupons[code]){
couponDiscount = Number(coupons[code]);
}else{
alert(
lang==="ku" ? "کۆپۆن نەدۆزرایەوە" :
lang==="ar" ? "الكوبون غير موجود" :
"Coupon not found"
);
}
}

renderCart();
}

/* ---------- CHANGE TOTAL ---------- */
function renderCart(){
let box = document.getElementById("cart");
box.innerHTML = "";
let total = 0;

cart.forEach(item=>{
let sum = item.price * item.qty;
total += sum;

box.innerHTML += `
<tr>
<td>${productName(item)}</td>
<td>${item.qty}</td>
<td>${sum}</td>
</tr>
`;
});

let finalTotal = total - discount - couponDiscount;
if(finalTotal < 0) finalTotal = 0;

document.getElementById("total").innerText = finalTotal;
}

/* ---------- RECEIPT ---------- */
function printReceipt(){
let text = "";

cart.forEach(i=>{
text += productName(i)+" x"+i.qty+" - "+(i.qty*i.price)+" IQD\n";
});

text += "------------------\n";

text += (
lang==="ku" ? "داشکاندن: " :
lang==="ar" ? "الخصم: " :
"Discount: "
) + discount + " IQD\n";

text += (
lang==="ku" ? "کۆپۆن: " :
lang==="ar" ? "الكوبون: " :
"Coupon: "
) + couponDiscount + " IQD\n";

text += "------------------\n";

text += (
lang==="ku" ? "کۆی گشتی: " :
lang==="ar" ? "المجموع: " :
"Total: "
) + document.getElementById("total").innerText + " IQD\n";

let win = window.open("","","width=350,height=600");
win.document.write("<pre style='font-size:18px'>" + text + "</pre>");
win.print();
}
</script>
